name: Employee Gamification CI

on:
  push:
  pull_request:

jobs:

  frontend:
    name: React Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gamification-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Build React application
        run: npm run build

  backend:
    name: Django Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Django
        run: |
          pip install django

      - name: Django System Check
        run: |
          python manage.py check